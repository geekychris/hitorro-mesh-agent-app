spring:
  application:
    name: hitorro-mesh-agent
  main:
    banner-mode: off
  # Boot 4 defaults to Jackson 3; HiTorro returns Jackson 2 JsonNode values.
  http:
    converters:
      preferred-json-mapper: jackson2

logging:
  level:
    root: INFO
    com.hitorro.mesh: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info

# All hitorro.mesh.agent.* fields are required at deployment time.
# Provide via environment, external YAML, or CLI --hitorro.mesh.agent.id=...
hitorro:
  mesh:
    agent:
      transport: nats
      nats-url: nats://localhost:4222
      heartbeat-interval: 2s
